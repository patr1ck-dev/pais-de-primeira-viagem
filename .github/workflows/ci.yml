name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci em vez de install: respeita o lockfile e falha se ele estiver
      # dessincronizado do package.json.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # O build roda sem nenhum segredo de propósito: as Fases 1 a 3 não podem
      # depender de credencial externa. Se algum dia falhar aqui por falta de
      # variável, é porque um import passou a exigir chave no topo do módulo.
      - run: npm run build

      - name: Auditoria de dependências
        run: npm audit --audit-level=high
